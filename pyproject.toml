[project]
name = "smahtutils"
version = "0.1.0"
description = "Python utilities for clipboard-to-LLM conversion and local semantic code search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "annoy>=1.17.3",
    "mcp>=1.27.2",
    "openai>=2.41.1",
    "pillow>=12.2.0",
    "starlette>=1.3.1",
    "tree-sitter>=0.25.0",
    "tree-sitter-bash>=0.25.0",
    "tree-sitter-c>=0.24.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-typescript>=0.23.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
smahtiepants = "smahtiepants.cli:main"
smahties = "smahties.cli:main"
wickedpaste = "wickedpaste.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
