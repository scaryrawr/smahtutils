name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Discover binary targets
        id: apps
        shell: bash
        run: |
          apps="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -c '[.packages[] | . as $pkg | .targets[] | select(.kind | index("bin")) | {package: $pkg.name, bin: .name}]'
          )"

          if [[ "$apps" == "[]" ]]; then
            echo "No binary targets found in workspace" >&2
            exit 1
          fi

          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app.bin }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
            needs_linker: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}-${{ matrix.app.package }}-${{ matrix.app.bin }}

      - name: Install Linux ARM64 linker
        if: matrix.needs_linker == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          fi

          cargo build --release --target "${{ matrix.target }}" --package "${{ matrix.app.package }}" --bin "${{ matrix.app.bin }}"

      - name: Compute ref name
        id: meta
        shell: bash
        run: echo "ref_safe=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.app.bin }}" "dist/${{ matrix.app.bin }}"
          tar -czf "${{ matrix.app.bin }}-${{ steps.meta.outputs.ref_safe }}-${{ matrix.target }}.tar.gz" -C dist "${{ matrix.app.bin }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.app.bin }}.exe" "dist/${{ matrix.app.bin }}.exe"
          Compress-Archive -Path "dist/${{ matrix.app.bin }}.exe" -DestinationPath "${{ matrix.app.bin }}-${{ steps.meta.outputs.ref_safe }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.app.bin }}-${{ steps.meta.outputs.ref_safe }}-${{ matrix.target }}
          path: ${{ matrix.app.bin }}-${{ steps.meta.outputs.ref_safe }}-${{ matrix.target }}.${{ matrix.ext }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
